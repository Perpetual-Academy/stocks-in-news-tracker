services:
  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      CREDENTIALS_PATH: /data/Credentials.txt
    volumes:
      - tracker-data:/data
    restart: unless-stopped

volumes:
  tracker-data:
